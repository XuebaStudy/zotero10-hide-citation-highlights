name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check JavaScript syntax
        run: node --check bootstrap.js

      - name: Validate metadata
        id: meta
        run: python scripts/verify.py --github-output "$env:GITHUB_OUTPUT"

      - name: Build package
        run: ./build.ps1

      - name: Verify package
        env:
          XPI_NAME: ${{ steps.meta.outputs.xpi_name }}
        run: python scripts/verify.py --xpi "$env:XPI_NAME"

      - name: Upload installable package
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-${{ matrix.os }}
          path: ${{ steps.meta.outputs.xpi_name }}
          if-no-files-found: error
          retention-days: 7

      - name: Show package download
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          XPI_NAME: ${{ steps.meta.outputs.xpi_name }}
        run: |
          @"
          ## Plugin download

          [Download the plugin package]($env:ARTIFACT_URL)

          Extract the downloaded ZIP, then install **$env:XPI_NAME** in Zotero.
          This package works on all supported operating systems. GitHub sign-in is required; the download is retained for 7 days.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append


